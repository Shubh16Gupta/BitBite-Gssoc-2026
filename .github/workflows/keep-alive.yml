# Keeps the free-tier Render services from sleeping.
#
# Render spins a free web service down after ~15 minutes without traffic, and
# returns 502 from its edge for ~30s while the container boots again. Pinging
# /health every 10 minutes keeps both instances warm so the first real request
# of a session is fast.
#
# COST WARNING: a Render account gets 750 free instance-hours per month across
# all free services. Keeping BOTH services awake 24/7 costs ~1440 hours, which
# exceeds that and will suspend them partway through the month. So the schedule
# below is commented out by default — enable it only around a demo, or trigger
# the workflow manually from the Actions tab when you need things warm.
name: Keep Render services awake

on:
  workflow_dispatch: # Actions tab -> Run workflow (safe, costs nothing when idle)
  # ENABLED FOR THE DEMO. Comment this block out again afterwards — leaving it
  # on permanently costs ~1440 instance-hours/month against a 750-hour free
  # allowance and will get both services suspended mid-month.
  schedule:
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ML service
        run: |
          curl -sS -m 120 -o /dev/null -w 'ml %{http_code} in %{time_total}s\n' https://anndata-ml.onrender.com/health

      - name: Ping API
        run: |
          curl -sS -m 120 -o /dev/null -w 'api %{http_code} in %{time_total}s\n' https://anndata-api.onrender.com/health
