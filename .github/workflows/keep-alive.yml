# Keeps the free-tier Render services from sleeping.
#
# Render spins a free web service down after ~15 minutes without traffic and
# returns 502 from its edge for ~30s while the container boots again. Pinging
# /health keeps both instances warm so the first real request of a session is fast.
#
# WHY A LOOP RATHER THAN CRON: GitHub's `schedule` trigger is best-effort. Short
# intervals like */10 are routinely delayed by many minutes or dropped entirely
# under load, which is more than enough for Render to fall asleep. Instead, one
# manual run holds a job open and pings on a fixed interval — reliable for as
# long as it runs. The cron below is kept only as a backstop.
#
# COST: Actions minutes are free on public repos. Render is the constraint — a
# free account gets 750 instance-hours/month across all services, and keeping
# BOTH awake 24/7 costs ~1440. Run this around demos, not permanently.
name: Keep Render services awake

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep pinging (max 350; GitHub kills jobs at 6h)'
        required: false
        default: '300'
  # Backstop only — do not rely on this firing on time.
  schedule:
    - cron: '*/10 * * * *'

# A newer run replaces an older one rather than stacking pings.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck job can never burn Render hours indefinitely.
    timeout-minutes: 355
    steps:
      - name: Ping both services
        env:
          ML: https://anndata-ml.onrender.com/health
          API: https://anndata-api.onrender.com/health
        run: |
          set -u
          # Scheduled runs have no inputs, so fall back to a single pass.
          MINUTES="${{ github.event.inputs.duration_minutes || '0' }}"
          INTERVAL=300   # 5 min — comfortably inside Render's ~15 min idle window
          END=$(( $(date +%s) + MINUTES * 60 ))

          ping_once() {
            for target in "$ML" "$API"; do
              curl -sS -m 120 -o /dev/null \
                -w "$(date -u +%H:%M:%S)  %{http_code}  %{time_total}s  $target\n" \
                "$target" || echo "$(date -u +%H:%M:%S)  FAILED  $target"
            done
          }

          ping_once
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep "$INTERVAL"
            ping_once
          done
